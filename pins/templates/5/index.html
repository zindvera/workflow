<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expensive Balcony Pin Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary-red: #e60023;
            --sticker-pink: #ff007a;
            --balcony-green: #2d6a4f; 
            --workspace-bg: #f3f4f6;
            --alert-bg: #fff5f5; /* Light reddish-white */
            --alert-border: #ffc9c9; /* Subtle red border */
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--workspace-bg); height: 100vh; overflow: hidden; }

        .sidebar {
            width: 360px; background: #ffffff; border-right: 1px solid #dee2e6;
            height: 100vh; overflow-y: auto; padding: 2rem 1.5rem; display: flex;
            flex-direction: column; gap: 1.5rem; z-index: 1000;
        }

        .preview-pane { flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 100vh; }

        .pin-container {
            width: 480px; position: relative; background-color: #ffffff; 
            box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.1); overflow: hidden;
            display: flex; flex-direction: column; border-radius: 4px;
        }

        .mockup-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: flex; align-items: center; justify-content: center; }
        #mockupImg { width: 100%; height: auto; }

        .darkness-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; opacity: 0.55; z-index: 1; pointer-events: none;
        }

        .overlay-layer {
            position: relative; z-index: 10; height: 100%; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; text-align: center; pointer-events: none;
        }

        .bubble-sticker {
            background: white; color: #111; padding: 10px 22px; border-radius: 60px;
            font-weight: 900; text-transform: uppercase; display: inline-block;
            margin: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 5px solid white; line-height: 1.25;
        }

        /* Color Hierarchy */
        .s-price { font-size: 2.5rem; color: var(--balcony-green); transform: rotate(1.5deg); padding: 10px 30px; }
        .s-balcony { font-size: 3.2rem; color: #000; width: 95%; border-radius: 20px; letter-spacing: -1.5px; padding: 15px 25px; }
        .s-look { font-size: 1.1rem; background: rgba(255,255,255,0.9); margin-bottom: -5px; padding: 6px 15px; }
        .s-expensive { 
            font-family: 'Dancing Script', cursive; font-size: 6.8rem; text-transform: none; 
            color: var(--sticker-pink); background: white; padding: 10px 50px; 
            margin-top: 10px; transform: rotate(-3deg); border: 8px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* NEW ALERT RECTANGLE FOMO TEXT */
        .s-alert-fomo { 
            font-size: 1.45rem; 
            color: #000; /* Bold Black Text */
            background: var(--alert-bg); 
            border: 3px solid var(--alert-border); 
            margin-top: 55px; /* High top margin for focus */
            padding: 10px 25px; 
            border-radius: 4px; /* Clean Rectangle */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            pointer-events: none;
            display: inline-block;
        }

        .upload-label { background: #212529; color: white; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: 800; }
        .btn-download { background: #000; color: white; font-weight: 900; padding: 1.25rem; border-radius: 1rem; border: none; width: 100%; margin-top: auto; letter-spacing: 1px; }
    </style>
</head>
<body class="d-flex">

    <aside class="sidebar">
        <div><h4 class="fw-900 mb-0">Pin Studio</h4><p class="text-muted small">Premium FOMO Creator</p></div>
        <div>
            <span class="section-title small fw-bold text-muted uppercase">Canvas Settings</span>
            <input type="range" id="heightSlider" min="500" max="1000" value="850" class="form-range mt-2">
        </div>
        <div class="p-3 bg-light rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="small fw-bold text-muted">IMAGE ADJUST</span>
                <label for="imageUpload" class="upload-label">UPLOAD</label>
                <input type="file" id="imageUpload" accept="image/*" class="d-none">
            </div>
            <label class="small fw-bold text-muted d-block mb-1">Darkness Overlay</label>
            <input type="range" id="darknessSlider" min="0" max="95" value="55" class="form-range mb-3">
            <label class="small fw-bold text-muted d-block mb-1">Zoom</label>
            <input type="range" id="zoomSlider" min="0.5" max="3" step="0.01" value="1.1" class="form-range">
        </div>
        <button id="downloadBtn" class="btn-download text-uppercase">Export HD Pin</button>
    </aside>

    <main class="preview-pane">
        <div id="captureArea" class="pin-container" style="height: 850px;">
            <div class="mockup-layer">
                <img id="mockupImg" src="" alt="" style="display:none;">
                <div id="darknessOverlay" class="darkness-overlay"></div>
                <div id="placeholder" class="text-center p-5 text-muted small fw-bold">UPLOAD PHOTO</div>
            </div>
            <div class="overlay-layer">
                <div class="bubble-sticker s-price">This $30 Item</div>
                <div class="bubble-sticker s-balcony">Will Make Your Small Balcony</div>
                <div class="bubble-sticker s-look">Look</div>
                <div class="bubble-sticker s-expensive">Expensive</div>
                <div class="s-alert-fomo">DON'T REGRET WAITING</div>
            </div>
        </div>
    </main>

    <script>
        const mockupImg = document.getElementById('mockupImg');
        const imageUpload = document.getElementById('imageUpload');
        const captureArea = document.getElementById('captureArea');
        const darknessSlider = document.getElementById('darknessSlider');
        const darknessOverlay = document.getElementById('darknessOverlay');
        const zoomSlider = document.getElementById('zoomSlider');
        const heightSlider = document.getElementById('heightSlider');
        const downloadBtn = document.getElementById('downloadBtn');

        heightSlider.addEventListener('input', (e) => captureArea.style.height = `${e.target.value}px`);
        darknessSlider.addEventListener('input', (e) => darknessOverlay.style.opacity = e.target.value / 100);
        zoomSlider.addEventListener('input', (e) => mockupImg.style.transform = `scale(${e.target.value})`);

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    mockupImg.src = event.target.result;
                    mockupImg.style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        downloadBtn.addEventListener('click', () => {
            html2canvas(captureArea, { useCORS: true, scale: 3, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `balcony-alert-pin.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            });
        });
    </script>
</body>
</html>
