<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board Collage Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --sticker-pink: #ff007a;
            --workspace-bg: #f3f4f6;
            --alert-bg: #fff5f5;
            --alert-border: #ffc9c9;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--workspace-bg); height: 100vh; overflow: hidden; }

        .sidebar {
            width: 380px; background: #ffffff; border-right: 1px solid #dee2e6;
            height: 100vh; overflow-y: auto; padding: 1.5rem; display: flex;
            flex-direction: column; gap: 1rem; z-index: 1000;
        }

        .preview-pane { flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* THE PIN */
        .pin-container {
            width: 480px; position: relative; background-color: #fff; 
            box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.2); overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* 6-IMAGE COLLAGE GRID */
        .collage-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
            z-index: 0; gap: 2px; background: #000;
        }

        .grid-item { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #222; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }

        .darkness-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; opacity: 0.55; z-index: 1; pointer-events: none;
        }

        .overlay-layer {
            position: relative; z-index: 10; height: 100%; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; text-align: center; pointer-events: none;
        }

        .bubble-sticker {
            background: white; color: #111; padding: 10px 22px; border-radius: 60px;
            font-weight: 900; text-transform: uppercase; display: inline-block;
            margin: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 5px solid white; line-height: 1.2;
        }

        .s-everyone { font-size: 1.4rem; opacity: 0.9; transform: rotate(-1deg); }
        .s-wrong { font-size: 2.8rem; color: #000; width: 95%; border-radius: 20px; letter-spacing: -1.5px; padding: 12px 25px; transform: rotate(1deg); }
        .s-look { font-size: 1.1rem; background: rgba(255,255,255,0.9); margin-bottom: -5px; padding: 6px 15px; }
        .s-payoff { 
            font-family: 'Dancing Script', cursive; font-size: 6.5rem; text-transform: none; 
            color: var(--sticker-pink); background: white; padding: 10px 50px; 
            margin-top: 10px; transform: rotate(-3deg); border: 8px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .s-alert-box { 
            font-size: 1.3rem; color: #000; background: var(--alert-bg); 
            border: 3px solid var(--alert-border); margin-top: 50px; 
            padding: 12px 30px; border-radius: 4px; font-weight: 800;
            text-transform: uppercase; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* UI ELEMENTS */
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mini-upload { background: #f0f0f0; border: 1px dashed #ccc; padding: 10px; text-align: center; font-size: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .mini-upload:hover { background: #e0e0e0; }
        .btn-download { background: #000; color: white; font-weight: 900; padding: 1.25rem; border: none; width: 100%; margin-top: auto; border-radius: 8px; }
    </style>
</head>
<body class="d-flex">

    <aside class="sidebar">
        <div><h4 class="fw-900 mb-0">Collage Studio</h4><p class="text-muted small">6-Image Background Engine</p></div>
        
        <div>
            <span class="small fw-bold text-muted text-uppercase mb-2 d-block">1. Upload 6 Images</span>
            <div class="upload-grid">
                <label class="mini-upload">IMG 1<input type="file" class="d-none" onchange="loadImg(event, 0)"></label>
                <label class="mini-upload">IMG 2<input type="file" class="d-none" onchange="loadImg(event, 1)"></label>
                <label class="mini-upload">IMG 3<input type="file" class="d-none" onchange="loadImg(event, 2)"></label>
                <label class="mini-upload">IMG 4<input type="file" class="d-none" onchange="loadImg(event, 3)"></label>
                <label class="mini-upload">IMG 5<input type="file" class="d-none" onchange="loadImg(event, 4)"></label>
                <label class="mini-upload">IMG 6<input type="file" class="d-none" onchange="loadImg(event, 5)"></label>
            </div>
        </div>

        <div class="p-3 bg-light rounded-3">
            <span class="small fw-bold text-muted text-uppercase d-block mb-2">2. Refine Appearance</span>
            <label class="small text-muted d-block mb-1">Darkness Overlay</label>
            <input type="range" id="darknessSlider" min="0" max="95" value="55" class="form-range mb-3">
            <label class="small text-muted d-block mb-1">Pin Height</label>
            <input type="range" id="heightSlider" min="600" max="1000" value="850" class="form-range">
        </div>

        <button id="downloadBtn" class="btn-download text-uppercase">Export Collage Pin</button>
    </aside>

    <main class="preview-pane">
        <div id="captureArea" class="pin-container" style="height: 850px;">
            <div class="collage-grid">
                <div class="grid-item"><img id="img0" src=""></div>
                <div class="grid-item"><img id="img1" src=""></div>
                <div class="grid-item"><img id="img2" src=""></div>
                <div class="grid-item"><img id="img3" src=""></div>
                <div class="grid-item"><img id="img4" src=""></div>
                <div class="grid-item"><img id="img5" src=""></div>
            </div>
            
            <div id="darknessOverlay" class="darkness-overlay"></div>
            
            <div class="overlay-layer">
                <div class="bubble-sticker s-everyone">Everyone's</div>
                <div class="bubble-sticker s-wrong">Vision Board Is Wrong</div>
                <div class="bubble-sticker s-look">Except</div>
                <div class="bubble-sticker s-payoff">These.</div>
                <div class="s-alert-box">SEE THE SECRET STRUCTURE INSIDE</div>
            </div>
        </div>
    </main>

    <script>
        const darknessSlider = document.getElementById('darknessSlider');
        const darknessOverlay = document.getElementById('darknessOverlay');
        const heightSlider = document.getElementById('heightSlider');
        const captureArea = document.getElementById('captureArea');

        heightSlider.addEventListener('input', (e) => captureArea.style.height = `${e.target.value}px`);
        darknessSlider.addEventListener('input', (e) => darknessOverlay.style.opacity = e.target.value / 100);

        function loadImg(event, index) {
            const img = document.getElementById(`img${index}`);
            const reader = new FileReader();
            reader.onload = function(){
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            html2canvas(captureArea, { useCORS: true, scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `vision-collage-pin.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        });
    </script>
</body>
</html>
